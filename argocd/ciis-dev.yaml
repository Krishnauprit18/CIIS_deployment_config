apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ciis-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Krishnauprit18/CIIS_deployment_config.git
    targetRevision: master
    path: chart

    helm:
      valueFiles:
        - environments/dev/values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
